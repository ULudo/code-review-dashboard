<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git Review Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="explorerScreen" class="screen explorer-screen" aria-label="Repository files">
        <header class="appbar">
          <div class="title-block">
            <span class="label">Explorer</span>
            <h1 id="repoPath">Loading...</h1>
            <div class="meta-line">
              <span id="branchName"></span>
              <span id="summaryText"></span>
            </div>
          </div>
          <button id="refreshButton" class="tool-button" type="button" title="Refresh" aria-label="Refresh">Refresh</button>
        </header>

        <div class="status-strip" aria-label="Change counts">
          <span><strong id="changedCount">0</strong> modified</span>
          <span><strong id="newCount">0</strong> new</span>
          <span><strong id="deletedCount">0</strong> deleted</span>
        </div>

        <nav id="fileList" class="file-tree" aria-label="File tree"></nav>
      </section>

      <section id="fileScreen" class="screen file-screen hidden" aria-label="File viewer">
        <header class="filebar">
          <button id="backButton" class="back-button" type="button">Back</button>
          <div class="file-heading">
            <h2 id="filePath"></h2>
            <span id="statusLabel"></span>
          </div>
          <div class="mode-toggle" role="group" aria-label="View mode">
            <button id="fullModeButton" type="button" class="active">Full</button>
            <button id="diffModeButton" type="button">Changes</button>
          </div>
        </header>

        <div id="message" class="message hidden"></div>
        <pre id="codeView" class="code-view" aria-label="Code"></pre>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
